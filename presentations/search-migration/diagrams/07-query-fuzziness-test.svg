<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1F4E79"/>
    </marker>
    <style>
      .node { fill: #EAF2F8; stroke: #1F4E79; stroke-width: 3; }
      .node2 { fill: #E8F4F2; stroke: #2A7F78; stroke-width: 3; }
      .node3 { fill: #FDEBD0; stroke: #C56B2C; stroke-width: 3; }
      .text { font-family: Helvetica, Arial, sans-serif; font-size: 28px; fill: #1B2631; text-anchor: middle; dominant-baseline: middle; }
      .small { font-family: Helvetica, Arial, sans-serif; font-size: 22px; fill: #5D6D7E; text-anchor: middle; dominant-baseline: middle; }
      .edge { fill: none; stroke: #1F4E79; stroke-width: 4; marker-end: url(#arrow); }
      .edge2 { fill: none; stroke: #C56B2C; stroke-width: 4; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 20px; fill: #1F4E79; text-anchor: middle; }
    </style>
  </defs>

  <rect x="25" y="25" width="1150" height="600" rx="18" fill="#FFFFFF" stroke="#D8E2EA" stroke-width="2"/>

  <rect class="node" x="70" y="115" width="150" height="72" rx="12"/>
  <text class="text" x="145" y="151">User query</text>

  <rect class="node" x="285" y="115" width="150" height="72" rx="12"/>
  <text class="text" x="360" y="151">Search API</text>

  <rect class="node2" x="500" y="115" width="165" height="72" rx="12"/>
  <text class="text" x="582.5" y="151">Exact filters</text>

  <rect class="node2" x="735" y="115" width="165" height="72" rx="12"/>
  <text class="text" x="817.5" y="151">match query</text>

  <polygon class="node3" points="1010,95 1105,151 1010,207 915,151"/>
  <text class="text" x="1010" y="143">fuzziness?</text>
  <text class="small" x="1010" y="173">AUTO</text>

  <rect class="node3" x="725" y="340" width="185" height="78" rx="12"/>
  <text class="text" x="817.5" y="369">Term</text>
  <text class="text" x="817.5" y="400">expansion</text>

  <rect class="node" x="480" y="340" width="190" height="78" rx="12"/>
  <text class="text" x="575" y="369">BM25</text>
  <text class="text" x="575" y="400">scoring</text>

  <rect class="node" x="250" y="340" width="165" height="78" rx="12"/>
  <text class="text" x="332.5" y="369">Ranked</text>
  <text class="text" x="332.5" y="400">hits</text>

  <rect class="node3" x="910" y="470" width="200" height="78" rx="12"/>
  <text class="text" x="1010" y="500">p99 latency</text>
  <text class="text" x="1010" y="531">risk</text>

  <path class="edge" d="M220 151 H285"/>
  <path class="edge" d="M435 151 H500"/>
  <path class="edge" d="M665 151 H735"/>
  <path class="edge" d="M900 151 H915"/>

  <path class="edge" d="M1010 207 V379 H910"/>
  <text class="label" x="952" y="286">on</text>

  <path class="edge" d="M915 151 C820 230, 690 250, 610 340"/>
  <text class="label" x="740" y="255">off</text>

  <path class="edge" d="M725 379 H670"/>
  <path class="edge" d="M480 379 H415"/>

  <path class="edge2" d="M910 418 C940 440, 970 455, 1000 470"/>
  <text class="label" x="996" y="447" fill="#C56B2C">more terms</text>
</svg>
